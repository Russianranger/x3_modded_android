name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Russianranger/trasc-server-android
          path: trasc-server-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Runner unit tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Generated controller files are current
        run: python3 -I tools/build_controls.py --check
      - name: X3 app ControllerInput accepts the X3 profile
        run: |
          out=$(mktemp -d); p=app/src/main/java/io/github/russianranger/x3
          javac -d "$out" $p/ControllerInput.java $p/DisplayInput.java tests/java/X3ControllerCheck.java
          java -cp "$out" io.github.russianranger.x3.X3ControllerCheck controls/generated/x3app-layers.tsv
      - name: Java and Python PE readers agree (NoSteam detection)
        run: |
          out=$(mktemp -d)
          python3 -I tests/pe_fixtures.py "$out/fixtures"
          javac -d "$out/classes" app/src/main/java/io/github/russianranger/x3/PeInfo.java tests/java/PeInfoCheck.java
          java -cp "$out/classes" io.github.russianranger.x3.PeInfoCheck "$out/fixtures"
      - name: Format-2 export works on TRASC's own ControllerInput
        run: tools/trasc_check/run.sh trasc-server-android
      - name: Shell scripts parse
        run: bash -n runtime/launch-wine.sh runtime/launch-native.sh tools/trasc_check/run.sh

  box64:
    # TRASC's pinned Box64 plus patches/box64 (first: "66 0F 01 E0" smsw ax, X3AP.exe start-up check).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Reuse a build of the same commit, patches and recipe
        id: cache
        uses: actions/cache@v4
        with:
          path: box64-out
          key: box64-2f130fab-${{ hashFiles('patches/box64/**', 'scripts/build_box64.sh', 'tests/box64/**') }}
      - name: Build and test patched Box64 (debian:bookworm-slim arm64, as the runtime)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p box64-out
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/box64-out:/out" debian:bookworm-slim bash /repo/scripts/build_box64.sh /out
      - run: cat box64-out/box64-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: box64
          path: box64-out/

  wintools:
    # Windows helpers run inside Wine (native/): built with MinGW, tested under real Wine + Xvfb.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW and Wine
        timeout-minutes: 12
        run: |
          sudo dpkg --add-architecture i386
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -q -o Dpkg::Use-Pty=0 --no-install-recommends gcc-mingw-w64-i686 wine wine32:i386 wine64 xvfb xauth
          wine --version
      - name: Build
        run: scripts/build_wintools.sh wintools-out
      - name: x3pin keeps the CryptoAPI DLLs loaded (Wine)
        timeout-minutes: 8
        run: xvfb-run -a tests/wine/run_pin_test.sh wintools-out
      - uses: actions/upload-artifact@v4
        with:
          name: wintools
          path: |
            wintools-out/x3pin.exe
            wintools-out/wintools-build.json

  media:
    # GStreamer add-on for winegstreamer (X3's music, voices, movies). Built once per recipe version
    # on the pinned runtime image, tested there, then reused from its release.
    runs-on: ubuntu-24.04-arm
    outputs:
      built: ${{ steps.published.outputs.found != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the published add-on
        id: published
        run: |
          mkdir -p media-out
          tag=$(grep -oP '^version=\K\S+' scripts/build_media_addon.sh)
          if curl -fsSL -o media-out/media-addon.json "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/media-addon.json"; then
            echo "found=true" >> "$GITHUB_OUTPUT"; cat media-out/media-addon.json
          else
            rm -f media-out/media-addon.json; echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and test the add-on inside the pinned runtime
        if: steps.published.outputs.found != 'true'
        run: |
          curl -fsSL --retry 3 -o runtime.tar.gz https://github.com/Russianranger/trasc-server-android/releases/download/client-runtime-v1/client-runtime-arm64.tar.gz
          echo "2f130c07683e50bc606af111d5c35c4f503c1427772c1f9b0f45e1e4b75c76c4  runtime.tar.gz" | sha256sum -c -
          docker import runtime.tar.gz x3-runtime:v1 && rm runtime.tar.gz
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/media-out:/out" x3-runtime:v1 bash /repo/scripts/build_media_addon.sh /out
          ls -la media-out
      - uses: actions/upload-artifact@v4
        with:
          name: media-addon
          path: media-out/

  media-publish:
    if: needs.media.outputs.built == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: media
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: media-addon
          path: media-out
      - name: Publish the add-on release (once per recipe version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(grep -oP '^version=\K\S+' scripts/build_media_addon.sh)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Media add-on ($tag): GStreamer for music, voices and movies" --notes-file docs/media-addon-notes.md --target "$GITHUB_SHA"
          gh release upload "$tag" media-out/media-addon-arm64.tar.gz media-out/media-addon.json

  apk:
    needs: [test, box64, media, wintools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: box64
          path: box64-out
      - uses: actions/download-artifact@v4
        with:
          name: wintools
          path: wintools-out
      - uses: actions/download-artifact@v4
        with:
          name: media-addon
          path: media-out
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Cache pinned payload archives
        uses: actions/cache@v4
        with:
          path: payload/cache
          key: payload-${{ hashFiles('payload/trasc-payload.lock.json') }}
      - name: Assemble and verify the native payload
        run: |
          python3 -I scripts/fetch_trasc_payload.py --box64 box64-out
          cp media-out/media-addon.json payload/out/assets/payload/media-addon.json
          cp wintools-out/x3pin.exe wintools-out/wintools-build.json payload/out/assets/payload/
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Surface compiler errors as annotations
        if: failure()
        run: |
          grep -E '^e: |error:|[.]java:[0-9]+: error' build.log | head -40 | sed 's/^/::error::/' || true
      - name: Android lint (informational)
        continue-on-error: true
        run: |
          gradle --no-daemon :app:lintDebug
          cat app/build/reports/lint-results-debug.txt
      - name: Verify the APK carries the pinned preview certificate
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee apk-signing.txt
          actual=$(grep -oP 'Signer #1 certificate SHA-256 digest: \K[0-9a-f]+' apk-signing.txt)
          test "$actual" = "$(cat signing/x3-preview.sha256)"
          unzip -l "$apk" | grep -E "lib/arm64-v8a/libproot.so|assets/payload/turnip.so|assets/payload/box64$|assets/payload/x3pin.exe|assets/runner/x3_runner.py|assets/controls/overlay-data.json"
      - name: Describe the build
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          apk = pathlib.Path("app/build/outputs/apk/debug/app-debug.apk")
          gradle = pathlib.Path("app/build.gradle").read_text()
          info = {"commit": os.environ["GITHUB_SHA"], "file": "x3-modded-android-preview.apk",
                  "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(), "bytes": apk.stat().st_size,
                  "version": re.search(r"versionName '([^']+)'", gradle).group(1),
                  "version_code": int(re.search(r"versionCode (\d+)", gradle).group(1)),
                  "application_id": "io.github.russianranger.x3",
                  "signing_certificate_sha256": pathlib.Path("signing/x3-preview.sha256").read_text().strip(),
                  "payload": json.loads(pathlib.Path("payload/out/assets/payload/payload-provenance.json").read_text())["sources"],
                  "box64": json.loads(pathlib.Path("payload/out/assets/payload/payload-provenance.json").read_text()).get("box64")}
          pathlib.Path("build-info.json").write_text(json.dumps(info, indent=2) + "\n")
          PY
          cp "$apk" x3-modded-android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: x3-modded-android-apk
          path: |
            x3-modded-android-preview.apk
            build-info.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            build.log
            app/build/reports/

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !failure() && !cancelled()
    needs: [apk, media-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: x3-modded-android-apk
      - name: Publish the rolling preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --prerelease --title "X3 Modded Android preview" --notes-file docs/release-notes.md --target "$GITHUB_SHA"
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" -f sha="$GITHUB_SHA" -F force=true
          gh release upload preview x3-modded-android-preview.apk build-info.json --clobber
          gh release edit preview --notes-file docs/release-notes.md
          # Corresponding sources for the reused TRASC binaries (PRoot GPL, Wine LGPL): upload once.
          if ! gh release view preview --json assets -q '.assets[].name' | grep -qx launcher-sources.tar.gz; then
            python3 -I scripts/fetch_trasc_payload.py --sources launcher-sources.tar.gz
            gh release upload preview launcher-sources.tar.gz --clobber
          fi
