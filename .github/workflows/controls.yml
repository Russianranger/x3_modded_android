name: controls
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Russianranger/trasc-server-android
          path: trasc-server-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generated files are current
        run: python3 -I tools/build_controls.py --check
      - name: Profile works on TRASC's ControllerInput
        run: tools/trasc_check/run.sh trasc-server-android
      - name: Launcher scripts parse
        run: bash -n runtime/launch-wine.sh runtime/launch-native.sh tools/trasc_check/run.sh
